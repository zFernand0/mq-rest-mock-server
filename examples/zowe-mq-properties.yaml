test:
  setup:
    cmd: DEFINE QL(ZOWE.TEST.DONT.USE) DESCR('A test queue to play with for Zowe') HARDENBO INDXTYPE(MSGID)
    expect: CSQMAQLC ' DEFINE QL' NORMAL COMPLETION
